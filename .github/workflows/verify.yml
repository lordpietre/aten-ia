name: Verify

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memvid-agent-core
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev clang libclang-dev \
            libgomp-dev pkg-config groff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - name: Run verification suite
        run: |
          set -o pipefail
          ../scripts/ci/verify.sh 2>&1 | tee /tmp/aten-ia-verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aten-ia-verify-log
          path: /tmp/aten-ia-verify.log
          retention-days: 7
